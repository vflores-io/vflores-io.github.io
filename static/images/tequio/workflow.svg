<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc"><title id="title">From a rough idea to a reviewed change</title><desc id="desc">Five stages connect intent, investigation, design, tasks and implementation evidence across coding sessions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#76b9ef" stroke-width="1.8"/></marker></defs><rect width="760" height="850" rx="24" fill="#10273b"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="40" y="54" fill="#83c7ff" font-size="17" font-weight="700" letter-spacing="3">TEQUIO</text><text x="40" y="98" fill="#f7f3e8" font-size="32" font-weight="700">An idea needs a way through.</text><rect x="40" y="132" width="680" height="99" rx="14" fill="#193950" stroke="#34576e"/><text x="60" y="167" fill="#83c7ff" font-size="17" font-weight="700">01</text><text x="106" y="168" fill="#f7f3e8" font-size="25" font-weight="700">Briefing</text><text x="106" y="204" fill="#b8cede" font-size="18">People · problem · scope</text><text x="690" y="167" text-anchor="end" fill="#c8e5f8" font-size="17">What are we building?</text><path d="M77 233V250" stroke="#76b9ef" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="253" width="680" height="99" rx="14" fill="#193950" stroke="#34576e"/><text x="60" y="288" fill="#83c7ff" font-size="17" font-weight="700">02</text><text x="106" y="289" fill="#f7f3e8" font-size="25" font-weight="700">Explore</text><text x="106" y="325" fill="#b8cede" font-size="18">Source · research · unknowns</text><text x="690" y="288" text-anchor="end" fill="#c8e5f8" font-size="17">What do we need to learn?</text><path d="M77 354V371" stroke="#76b9ef" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="374" width="680" height="99" rx="14" fill="#193950" stroke="#34576e"/><text x="60" y="409" fill="#83c7ff" font-size="17" font-weight="700">03</text><text x="106" y="410" fill="#f7f3e8" font-size="25" font-weight="700">Design</text><text x="106" y="446" fill="#b8cede" font-size="18">Approach · tradeoffs</text><text x="690" y="409" text-anchor="end" fill="#c8e5f8" font-size="17">How should it work?</text><path d="M77 475V492" stroke="#76b9ef" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="495" width="680" height="99" rx="14" fill="#193950" stroke="#34576e"/><text x="60" y="530" fill="#83c7ff" font-size="17" font-weight="700">04</text><text x="106" y="531" fill="#f7f3e8" font-size="25" font-weight="700">Tasks</text><text x="106" y="567" fill="#b8cede" font-size="18">Ownership · acceptance · dependencies</text><text x="690" y="530" text-anchor="end" fill="#c8e5f8" font-size="17">What is the next bounded piece?</text><path d="M77 596V613" stroke="#76b9ef" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="616" width="680" height="99" rx="14" fill="#193950" stroke="#34576e"/><text x="60" y="651" fill="#83c7ff" font-size="17" font-weight="700">05</text><text x="106" y="652" fill="#f7f3e8" font-size="25" font-weight="700">Build</text><text x="106" y="688" fill="#b8cede" font-size="18">Implementation · checks · review</text><text x="690" y="651" text-anchor="end" fill="#c8e5f8" font-size="17">Does the result hold up?</text><rect x="40" y="757" width="680" height="56" rx="12" fill="#0e67b4"/><text x="380" y="792" text-anchor="middle" fill="#f7f3e8" font-size="21" font-weight="600">Decisions + evidence stay with the project.</text></g></svg>